<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f29a13">
  <meta name="description" content="Sign in or create your Sun Son Solar account.">
  <title>Sun Son Solar — Welcome</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card login-card" id="login-view" aria-labelledby="login-title">
    <header class="brand">
      <img class="brand-logo" src="PCTURES/sunsun%20logo.png" alt="Sun Son Solar" width="122" height="122">
    </header>
    <p class="eyebrow">Login</p>
    <h1 class="view-title" id="login-title">Welcome back!!!</h1>
    <form id="login-form">
      <div class="login-fields">
        <input name="username" autocomplete="username" placeholder="Username" aria-label="Username" required>
        <input name="password" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required>
      </div>
      <button class="action" type="submit">Log in</button>
      <p class="notice" role="status" aria-live="polite"></p>
    </form>
    <p class="switch">Don’t have an account yet? <button type="button" data-show="signup">Sign up now!</button></p>
  </main>

  <main class="card" id="signup-view" aria-labelledby="signup-title" hidden>
    <header class="brand">
      <img class="brand-logo" src="PCTURES/sunsun%20logo.png" alt="Sun Son Solar" width="108" height="108">
    </header>
    <p class="eyebrow">Sign Up</p>
    <h1 class="view-title" id="signup-title">Create your account</h1>
    <form id="signup-form">
      <div class="fields">
        <input name="firstName" autocomplete="given-name" placeholder="First name" aria-label="First name" maxlength="50" pattern=".*\S.*" title="Enter your first name without leaving it blank." required>
        <input name="middleName" autocomplete="additional-name" placeholder="Middle name" aria-label="Middle name" maxlength="50">
        <input name="lastName" autocomplete="family-name" placeholder="Last name" aria-label="Last name" maxlength="50" pattern=".*\S.*" title="Enter your last name without leaving it blank." required>
        <input name="birthDate" type="date" aria-label="Date of birth" required>
        <select name="gender" aria-label="Gender" required>
          <option value="" selected disabled>Gender</option>
          <option>Female</option><option>Male</option><option>Other</option>
        </select>
        <input class="wide" name="address" autocomplete="street-address" placeholder="Address" aria-label="Address" maxlength="255" pattern=".*\S.*" title="Enter your address." required>
        <input name="email" type="email" autocomplete="email" placeholder="Email" aria-label="Email" maxlength="255" required>
        <input name="phone" type="tel" autocomplete="tel" placeholder="Phone number" aria-label="Phone number" maxlength="20" pattern="(?=.*[0-9])[+()0-9.\s-]{7,20}" title="Enter a phone number using 7 to 20 characters, including at least one digit." required>
        <input name="newUsername" autocomplete="username" placeholder="Username" aria-label="Username" minlength="3" maxlength="100" pattern="[A-Za-z0-9._-]+" title="Use 3 to 100 letters, numbers, periods, underscores, or hyphens." required>
        <input name="newPassword" type="password" autocomplete="new-password" placeholder="Password" aria-label="Password" minlength="8" pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,}" title="Use at least 8 characters, including a letter and a number." required>
        <input class="wide" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Confirm password" aria-label="Confirm password" minlength="8" required>
      </div>
      <button class="action" type="submit">Create account</button>
      <p class="notice" role="status" aria-live="polite"></p>
    </form>
    <p class="switch">Already have an account? <button type="button" data-show="login">Log in</button></p>
  </main>

  <script>
    const loginView = document.querySelector('#login-view');
    const signupView = document.querySelector('#signup-view');
    const loginForm = document.querySelector('#login-form');
    const signupForm = document.querySelector('#signup-form');
    const loginNotice = loginForm.querySelector('.notice');
    const password = signupForm.elements.newPassword;
    const confirmPassword = signupForm.elements.confirmPassword;
    const birthDate = signupForm.elements.birthDate;
    const today = new Date();
    birthDate.max = [today.getFullYear(), String(today.getMonth() + 1).padStart(2, '0'), String(today.getDate()).padStart(2, '0')].join('-');

    function validatePasswordMatch() {
      confirmPassword.setCustomValidity(
        confirmPassword.value && confirmPassword.value !== password.value
          ? 'Passwords do not match.'
          : ''
      );
    }
    password.addEventListener('input', validatePasswordMatch);
    confirmPassword.addEventListener('input', validatePasswordMatch);

    function showView(signup) {
      loginView.hidden = signup;
      signupView.hidden = !signup;
      (signup ? signupView : loginView).querySelector('input')?.focus({ preventScroll: true });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function sendAuthRequest(endpoint, data) {
      let response;
      try {
        response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify(data)
        });
      } catch {
        throw new Error('Cannot reach the server. Start Apache and MySQL in XAMPP, then open this page through http://localhost.');
      }

      const result = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(result.error || 'The request could not be completed.');
      return result;
    }

    document.querySelectorAll('[data-show]').forEach(button => button.addEventListener('click', () => {
      showView(button.dataset.show === 'signup');
    }));

    loginForm.addEventListener('submit', async event => {
      event.preventDefault();
      const form = event.currentTarget;
      if (!form.reportValidity()) return;
      const notice = form.querySelector('.notice');
      const button = form.querySelector('[type="submit"]');
      button.disabled = true;
      notice.textContent = '';
      try {
        const result = await sendAuthRequest('api/login.php', {
          username: form.elements.username.value.trim(),
          password: form.elements.password.value
        });
        notice.textContent = `Welcome, ${result.username}. You are signed in.`;
        notice.className = 'notice success';
        form.elements.password.value = '';
      } catch (error) {
        notice.textContent = error.message;
        notice.className = 'notice error';
        form.elements.password.value = '';
        form.elements.password.focus();
      } finally {
        button.disabled = false;
      }
    });

    signupForm.addEventListener('submit', async event => {
      event.preventDefault();
      const form = event.currentTarget;
      validatePasswordMatch();
      if (!form.reportValidity()) return;
      const notice = form.querySelector('.notice');
      const button = form.querySelector('[type="submit"]');
      const username = form.elements.newUsername.value.trim();
      const data = Object.fromEntries(new FormData(form));
      data.firstName = data.firstName.trim();
      data.middleName = data.middleName.trim();
      data.lastName = data.lastName.trim();
      data.address = data.address.trim();
      data.email = data.email.trim();
      data.phone = data.phone.trim();
      data.newUsername = username;
      button.disabled = true;
      notice.textContent = '';
      try {
        await sendAuthRequest('api/register.php', data);
        form.reset();
        confirmPassword.setCustomValidity('');
        loginForm.elements.username.value = username;
        loginNotice.textContent = 'Registration complete. Sign in with your new account.';
        loginNotice.className = 'notice success';
        showView(false);
      } catch (error) {
        notice.textContent = error.message;
        notice.className = 'notice error';
      } finally {
        button.disabled = false;
      }
    });

    document.querySelectorAll('form').forEach(form => form.addEventListener('input', () => {
      const notice = form.querySelector('.notice');
      notice.textContent = '';
      notice.classList.remove('success');
    }));
  </script>
</body>
</html>
