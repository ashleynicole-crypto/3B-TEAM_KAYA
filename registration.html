<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up | Sun Son Solar</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body class="auth-split-body signup-body">
    <main class="auth-split-page signup-page">
        <div class="auth-photo signup-photo" role="img" aria-label="Solar panels beneath a bright sky">
            <img class="side-logo signup-side-logo" src="PCTURES/sunsun%20logo.png" alt="Sun Son Solar">
        </div>

        <section class="auth-pane signup-pane" aria-labelledby="signup-title">
            <p class="auth-welcome">Welcome!</p>
            <div class="auth-card signup-card">
                <h1 id="signup-title">Sign up</h1>
                <form class="auth-form signup-form">
                    <div class="signup-grid">
                        <div class="auth-field">
                            <label for="firstname">First name</label>
                            <input type="text" id="firstname" name="firstname" autocomplete="given-name" required>
                        </div>
                        <div class="auth-field">
                            <label for="middlename">Middle name</label>
                            <input type="text" id="middlename" name="middlename" autocomplete="additional-name">
                        </div>
                        <div class="auth-field">
                            <label for="lastname">Last name</label>
                            <input type="text" id="lastname" name="lastname" autocomplete="family-name" required>
                        </div>
                        <div class="auth-field">
                            <label for="email">Email address</label>
                            <input type="email" id="email" name="email" autocomplete="email" required>
                        </div>
                        <div class="auth-field">
                            <label for="gender">Gender</label>
                            <select id="gender" name="gender" required>
                                <option value="">Select gender</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                                <option value="prefernottosay">Prefer not to say</option>
                            </select>
                        </div>
                        <div class="auth-field">
                            <label for="birthdate">Birthdate</label>
                            <input type="date" id="birthdate" name="birthdate" autocomplete="bday" required>
                        </div>
                        <div class="auth-field signup-field-wide">
                            <label for="address">Address</label>
                            <textarea id="address" name="address" rows="2" autocomplete="street-address" required></textarea>
                        </div>
                        <div class="auth-field">
                            <label for="phone">Contact number</label>
                            <input type="tel" id="phone" name="phone" autocomplete="tel" required>
                        </div>
                        <div class="auth-field">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" autocomplete="new-password" required>
                        </div>
                        <div class="auth-field signup-field-wide">
                            <label for="username">Username</label>
                            <input type="text" id="username" name="username" autocomplete="username" required>
                        </div>
                    </div>
                    <div class="signup-actions">
                        <button class="auth-submit" type="submit">Sign up now</button>
                        <button class="auth-reset" type="reset">Clear</button>
                    </div>
                </form>
                <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
            </div>
            <footer class="auth-footer" aria-label="Information links">
                <a href="index.html#about">About <span aria-hidden="true">→</span></a>
                <a href="index.html#contact">Contact <span aria-hidden="true">→</span></a>
                <a href="index.html#terms">Terms <span aria-hidden="true">→</span></a>
            </footer>
        </section>
    </main>
</body>
</html>
